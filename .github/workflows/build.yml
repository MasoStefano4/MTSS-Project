name: Build Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Scarica il codice dal repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Installa Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Step 1 - Compilazione
      - name: Compile
        run: mvn compile

      # Step 2 - Esecuzione dei test
      - name: Test
        run: mvn test

      # Step 3 - Analisi statica + package
      - name: Static Analysis and Package
        run: mvn package -DskipTests

      # Step 4 - Pubblica coverage su Coveralls
      - name: Coveralls
        run: mvn coveralls:report
        continue-on-error: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}